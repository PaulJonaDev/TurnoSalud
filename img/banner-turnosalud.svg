<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">TurnoSalud - Tablero de sala de espera</title>
  <desc id="d">Banner con un visor de turno actual y el nombre del proyecto TurnoSalud</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b4a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <style>
      .title{font:800 64px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-1px}
      .sub{font:500 24px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#b9f3ea}
      .lbl{font:700 14px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#5eead4;letter-spacing:3px}
      .num{font:800 84px 'Courier New',monospace;fill:#fff}
      .pill{font:600 15px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#0b3b4a}
      .pulse{animation:p 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes p{0%,100%{opacity:1}50%{opacity:.45}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <circle cx="1100" cy="40" r="140" fill="#ffffff" opacity=".05"/>
  <circle cx="80" cy="300" r="110" fill="#ffffff" opacity=".05"/>

  <!-- Cruz médica -->
  <g transform="translate(70 92)">
    <rect width="64" height="64" rx="16" fill="#ffffff"/>
    <rect x="26" y="14" width="12" height="36" rx="3" fill="#0f766e"/>
    <rect x="14" y="26" width="36" height="12" rx="3" fill="#0f766e"/>
  </g>

  <text x="156" y="146" class="title">TurnoSalud</text>
  <text x="72" y="214" class="sub">Tablero de sala de espera en JavaScript puro</text>

  <g transform="translate(72 244)">
    <rect width="150" height="34" rx="17" fill="#5eead4"/>
    <text x="75" y="22" text-anchor="middle" class="pill">HTML · CSS · JS</text>
  </g>

  <!-- Visor de turno -->
  <g transform="translate(790 60)">
    <rect width="340" height="200" rx="20" fill="#06242d" stroke="#5eead4" stroke-width="2"/>
    <text x="170" y="52" text-anchor="middle" class="lbl">TURNO ACTUAL</text>
    <text x="170" y="140" text-anchor="middle" class="num pulse">A-024</text>
    <circle cx="170" cy="172" r="6" fill="#5eead4" class="pulse"/>
  </g>
</svg>
