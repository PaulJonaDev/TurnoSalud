<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de espera · TurnoSalud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="barra">
    <div class="barra__marca">
      <span class="barra__cruz" aria-hidden="true"></span>
      <div>
        <p class="barra__entidad">TurnoSalud</p>
        <p class="barra__sede">Sede Av. 68 · Atención al usuario</p>
      </div>
    </div>
    <p class="barra__reloj">Módulos 1 a 4 · Abierto</p>
  </header>

  <main class="tablero">

    
    <section class="visor" aria-live="polite">
      <p class="visor__rotulo">Turno en atención</p>

      <p class="visor__Numero"  id="visorNumero">— — —</p>

     
      <p class="visor__Modulo"  id="visorModulo">Esperando llamado</p>
    </section>

    
    <section class="panel">
      <h2 class="panel__titulo">Panel del módulo</h2>

      <button class="boton boton--principal" id="btnLlamar">
        Llamar siguiente
      </button>

      <div class="panel__campo">
        <label class="panel__etiqueta" for="buscador">Buscar en la fila</label>
      
        <input
        id="buscador"
          class="panel__input"
          type="text"
          placeholder="Número de turno o documento">
      </div>

      <div class="panel__conteo">
        <p class="conteo">
          
          <span class="conteo__cifra" id="contadorFila">0</span>
          <span class="conteo__texto">en espera</span>
        </p>
      </div>
    </section>

    
    <section class="fila">
      <div class="fila__encabezado">
        <h2 class="fila__titulo">Fila de espera</h2>
        <p class="fila__nota">Orden de llegada</p>
      </div>

      
      <ul class="fila__lista" id="listaEspera"></ul>

      <p class="fila__vacia" id="mensajeVacio">No hay turnos cargados.</p>
    </section>

  </main>

  <footer class="pie">
    <p> 2026 Jonathan Paul &amp; Desarrollador Full Stack · TurnoSalud</p>

  <script src="./app.js"></script>
</body>
</html>
